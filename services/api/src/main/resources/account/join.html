<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LycanSync · 账号入口</title>
  <style>
    * { box-sizing:border-box; }
    body { margin:0; min-height:100dvh; display:grid; place-items:center; background:#10151a; color:#e7edf3; font:14px/20px system-ui,sans-serif; }
    main { width:min(560px,100%); padding:32px; }
    .brand { margin:0 0 24px; color:#93a4b5; font-size:13px; }
    h1 { margin:0; overflow-wrap:anywhere; font-size:24px; line-height:32px; }
    .subtitle { margin:4px 0 0; color:#93a4b5; font-size:13px; }
    .details { margin:24px 0; }
    .details h2 { margin:0; font-size:14px; line-height:20px; font-weight:500; }
    .details p { margin:4px 0 0; color:#93a4b5; font-size:13px; overflow-wrap:anywhere; }
    .details .server { margin:16px 0 0; font-size:12px; }
    footer { display:flex; align-items:center; gap:16px; border-top:1px solid #202b35; padding-top:16px; }
    .feedback { display:flex; align-items:center; gap:8px; flex:1; min-width:0; height:40px; color:#f09c9c; font-size:12px; }
    .feedback p { flex:1; min-width:0; max-height:40px; margin:0; overflow:auto; overflow-wrap:anywhere; }
    .actions { display:flex; flex-wrap:wrap; justify-content:flex-end; align-items:center; gap:8px; flex-shrink:0; }
    a,button { display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:32px; padding:5px 10px; border:1px solid #2b3742; border-radius:6px; background:#1a232c; color:#e7edf3; text-decoration:none; cursor:pointer; font:14px/20px system-ui,sans-serif; }
    a:hover,button:hover:not(:disabled) { background:#25313c; }
    .primary { border-color:#3b82f6; background:#3b82f6; }
    .primary:hover:not(:disabled) { background:#3174df; }
    .retry { flex-shrink:0; padding:0; border:0; background:transparent; color:#93a4b5; font-size:12px; }
    .retry:hover:not(:disabled) { background:transparent; color:#e7edf3; }
    button:disabled { opacity:.5; cursor:default; }
    a:focus-visible,button:focus-visible { outline:none; border-color:#93a4b5; }
    [hidden] { display:none; }
    @media (max-width:520px) { footer { display:block; } .feedback { margin-bottom:8px; } }
    @media (max-width:420px) { main { padding:24px; } h1 { font-size:22px; } }
  </style>
  <script defer src="/join.js"></script>
</head>
<body><main>
  <p class="brand">LycanSync <span id="kind">· 账号入口</span></p>
  <header>
    <h1 id="title">与你的朋友相聚</h1>
    <p id="subtitle" class="subtitle">一起开黑，一起看</p>
  </header>
  <section class="details" aria-labelledby="status">
    <h2 id="status" role="status">正在检查链接…</h2>
    <p id="instruction">首次使用请先安装 Windows 应用，再点击“打开应用”。</p>
    <p class="server">服务器 · <span id="server"></span></p>
  </section>
  <footer>
    <div class="feedback">
      <p id="error" role="alert"></p>
      <button id="retry" type="button" class="retry" hidden>重新检查</button>
    </div>
    <div class="actions">
      <a id="download" href="/downloads/LycanSync-setup.exe" download>下载 Windows 应用</a>
      <button id="open" type="button" class="primary" disabled>打开应用<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6" /></svg></button>
    </div>
  </footer>
</main></body></html>
