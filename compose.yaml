name: lycan-sync

services:
  postgres:
    image: postgres:18.6-bookworm
    restart: "no"
    environment:
      POSTGRES_DB: lycansync
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
      TZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lycansync"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    cpus: 1.0
    mem_limit: 512m
    memswap_limit: 512m
    shm_size: 128mb
    stop_grace_period: 30s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  livekit:
    image: livekit/livekit-server:v1.13.6
    restart: "no"
    environment:
      LIVEKIT_CONFIG: |
        port: ${LIVEKIT_PORT:-7990}
        bind_addresses: ["0.0.0.0"]
        rtc:
          tcp_port: ${LIVEKIT_TCP_PORT:-7991}
          udp_port: ${LIVEKIT_UDP_PORT:-7992}
          use_external_ip: false
          node_ip: 127.0.0.1
        keys:
          "${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY in the root .env file}": "${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET in the root .env file}"
    ports:
      # 宿主机只接受本机连接，容器内监听全部网卡供 Docker 端口转发。
      - "127.0.0.1:${LIVEKIT_PORT:-7990}:${LIVEKIT_PORT:-7990}/tcp"
      - "127.0.0.1:${LIVEKIT_TCP_PORT:-7991}:${LIVEKIT_TCP_PORT:-7991}/tcp"
      - "127.0.0.1:${LIVEKIT_UDP_PORT:-7992}:${LIVEKIT_UDP_PORT:-7992}/udp"
    # 媒体转发运行时允许使用双核和 1 GiB；这是上限而非预留，停止容器后不占用资源。
    cpus: 2.0
    mem_limit: 1g
    memswap_limit: 1g
    stop_grace_period: 30s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
