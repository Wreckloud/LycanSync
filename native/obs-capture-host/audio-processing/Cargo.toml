[package]
name = "lycansync-obs-audio-processing"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-2.0-or-later"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
sonora = "=0.2.0"
sonora-agc2 = "=0.2.0"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"

[build-dependencies]
cc = "=1.2.46"
